<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>

    <script id="tailwind-config">
       tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f43625",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>

    <style>
        html, body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
    	background-image: url('/static/img/sakura5.jpeg');
    	background-size: cover;
    	background-position: center;
    	background-repeat: no-repeat;
    	background-attachment: fixed;
	color: #0f172a; /* Slate 900 para máxima legibilidad */
	}
	/* Modificación de contenedores traslúcidos para lectura perfecta */
	.section-card-bg {
    	background-color: rgba(255, 255, 255, 0.85);
    	backdrop-filter: blur(8px);
    	border: 1px solid rgba(230, 81, 0, 0.15);
	}
    </style>

    <title>Kizuna Venezuela</title>
</head>
<body class="font-display text-slate-900 dark:text-slate-100 transition-colors duration-300 relative min-h-screen">

<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
    <!-- Header Monolínea Compacto -->
    <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md text-white shadow-lg border-b border-primary/20">
        <div class="w-full px-6 lg:px-20 py-3 flex items-center justify-between">
            <h1 class="text-lg font-extrabold tracking-tight">Kizuna Venezuela</h1>
            
            <div class="flex items-center gap-6">
                <!-- Botón Menú Móvil -->
                <button id="mobileMenuBtn" class="md:hidden flex items-center justify-center w-9 h-9 rounded-lg hover:bg-white/10 transition-colors" aria-label="Abrir menú" aria-expanded="false">
                    <span class="material-symbols-outlined">menu</span>
                </button>

                <!-- Menú Navegación Desktop -->
                <nav class="hidden md:flex items-center gap-6">
                    <a class="text-sm font-semibold hover:text-primary transition-colors" href="index.html">Inicio</a>
                    <a class="text-sm font-semibold hover:text-primary transition-colors" href="javascript:history.back()">Volver</a>
                    <a class="text-sm font-semibold hover:text-primary transition-colors" href="D-Karate.html">Escuelas y Asociaciones</a>
                </nav>
            </div>
        </div>

        <!-- Menú Desplegable Móvil -->
        <div id="mobileMenuPanel" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-6 py-4 flex-col gap-3">
            <a class="text-sm font-semibold hover:text-primary transition-colors py-1 block" href="index.html">Inicio</a>
            <a class="text-sm font-semibold hover:text-primary transition-colors py-1 block" href="javascript:history.back()">Volver</a>
            <a class="text-sm font-semibold hover:text-primary transition-colors py-1 block" href="D-Karate.html">Escuelas y Asociaciones</a>
        </div>
    </header>

    <!-- Área de Contenido Principal -->
    <main class="mx-auto w-full max-w-7xl px-6 py-12 flex-grow">
        <section class="mb-4">
            <h2 class="mb-4 text-4xl lg:text-5xl font-black leading-tight tracking-tight text-slate-900 dark:text-white">
               Título de la Página
            </h2>
        </section>

        <section class="mb-20">
            <div class="rounded-xl bg-white/90 p-6 shadow-md border border-slate-300 dark:bg-slate-900/90 dark:border-slate-800 backdrop-blur-md">
                <p class="text-slate-700 dark:text-slate-300">Contenido base de la vista...</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950/90 backdrop-blur-md text-white py-4 text-center border-t border-slate-800 mt-auto">
        <div class="max-w-4xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-2 text-xs">
            <div>
                <span class="font-black text-sm">Kizuna Venezuela</span>
                <span class="text-slate-400 ml-2 hidden sm:inline">| Difusión y preservación de la cultura japonesa en Venezuela.</span>
            </div>
            <div class="text-slate-500">
                © 2026 Kizuna Venezuela. Todos los derechos reservados.
            </div>
        </div>
    </footer>
</div>

<!-- Script del Menú Móvil -->
<script>
    (function(){
        const btn = document.getElementById('mobileMenuBtn');
        const panel = document.getElementById('mobileMenuPanel');
        if (btn && panel) {
            btn.addEventListener('click', () => {
                panel.classList.toggle('hidden');
                panel.classList.toggle('flex');
            });
        }
    })();
</script>

<!-- Carga del Chatbot -->
<script src="/chatbot.js"></script>
</body>
</html>
